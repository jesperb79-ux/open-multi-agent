# Publicering av Eskilscupens reseplanerare på Netlify.
# "Base directory" pekar på appmappen, så alla sökvägar nedan är relativa till den.

[build]
  base    = "apps/eskilscupen-bussar"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Appen är en enda sida utan klientroutning, men en katch-all gör att en
# direktlänk eller omladdning av vilken sökväg som helst landar rätt.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite hashar filnamnen, så byggartefakter kan cachas hårt.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
